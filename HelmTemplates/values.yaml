fullnameOverride: frontloginapp
replicaCount: 2
image:
  repository: VALUE_TO_BE_OVERRIDDEN
  tag: latest
  pullPolicy: Always

priorityClassName: frontend-priority

imagePullSecrets: []

service:
  port: 80

environment: "dev"

ingress:
  enabled: false
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/appgw-ssl-certificate: VALUE_TO_BE_OVERRIDDEN
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
  path: VALUE_TO_BE_OVERRIDDEN
  hostname: VALUE_TO_BE_OVERRIDDEN

secrets: {}

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

applicationInsights:
  InstrumentationKey: VALUE_TO_BE_OVERRIDDEN