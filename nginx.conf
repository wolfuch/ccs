server {
    listen       80;
    listen  [::]:80;

    resolver kube-dns.kube-system.svc.cluster.local valid=5s;

    server_name  localhost;
    
    #setear variables /última Prueba 23-08-2023
    set $SCRIPT "script-src 'self'";
    set $SCRIPT "${SCRIPT} https://*.rednegocios.cl";
    set $SCRIPT "${SCRIPT} 'sha256-eCe5bOhGcDBv5wyLe4wm2b4Os0dCBLizH7q2u2lhN4U='";
    set $STYLE "style-src 'self'";
    set $STYLE "${STYLE} https://*.rednegocios.cl/dist/js/*";
    set $STYLE "${STYLE} 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='";
    set $STYLE "${STYLE} https://registry.npmjs.org/*";
    set $STYLE "${STYLE} 'sha256-tc8Mz2OIxo69s0W5jsNX846P0aDkc2jAr12Cp33z2cc='";
    set $IMG "img-src 'self' data:";
    set $IMG "${IMG} https://*.rednegocios.cl/img/*";
    set $IMG "${IMG} https://*.rednegocios.cl/favicon/*";
    set $FONT "font-src 'self' data:";
    set $FONT "${FONT} https://*.rednegocios.cl/dist/fon/*";
    set $DEFAULT "default-src 'self'";
    set $CONNECT "connect-src 'self'";
    set $CONNECT "${CONNECT} https://*.rednegocios.cl";
    set $FRAME "frame-src 'self'";
    set $FRAME "${FRAME} https://*.rednegocios.cl";
    set $FANC  "frame-ancestors 'self'";
    set $FACT  "form-action 'self'";

    #add_header Content-Security-Policy "${SCRIPT}; ${STYLE}; ${IMG}; ${FONT}; ${DEFAULT}; ${CONNECT}; ${FRAME}; ${FANC}; ${FACT}";    
    
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection 1;
    add_header Expect-CT 'enforce; max-age=7776000';
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()";
    add_header Referrer-Policy 'strict-origin';
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 64M;

    server_tokens off;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }

    location ~ ^/api/(.*)$ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;    

        proxy_pass http://backendapi.backendapi.svc.cluster.local:80/api/$1$is_args$args;
        proxy_redirect off;
    }
}