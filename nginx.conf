worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server_tokens off;
    more_clear_headers 'Server';

    add_header Server "" always;

    server {
        listen       80;
        listen  [::]:80;

        resolver kube-dns.kube-system.svc.cluster.local valid=5s;

        server_name  localhost;

        #setear variables
        set $SCRIPT "script-src 'self'";
        set $SCRIPT "${SCRIPT} https://*.rednegocios.cl";
        set $SCRIPT "${SCRIPT} 'sha256-eCe5bOhGcDBv5wyLe4wm2b4Os0dCBLizH7q2u2lhN4U='";
        set $STYLE "style-src 'self'";
        set $STYLE "${STYLE} https://*.rednegocios.cl/*";
        set $STYLE "${STYLE} 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='";
        set $STYLE "${STYLE} https://registry.npmjs.org/sweetalert2/* ";
        set $STYLE "${STYLE} 'sha256-fxT2vEPirY2ASBNBFCBWwEsLxCZJd3gjen03Q2lKeKE='";
        set $IMG "img-src 'self' data:";
        set $IMG "${IMG} https://*.rednegocios.cl/img/*";
        set $IMG "${IMG} https://*.rednegocios.cl/favicon/*";
        set $FONT "font-src 'self' data:";
        set $FONT "${FONT} https://*.rednegocios.cl/dist/fon/*";
        set $DEFAULT "default-src 'self'";
        set $CONNECT "connect-src 'self'";
        set $CONNECT "${CONNECT} https://*.rednegocios.cl";
        set $FRAME "frame-src 'self'";
        set $FRAME "${FRAME} https://*.rednegocios.cl";
        set $FANC  "frame-ancestors 'self'";
        set $FACT  "form-action 'self'";

        add_header Content-Security-Policy "${SCRIPT}; ${STYLE}; ${IMG}; ${FONT}; ${DEFAULT}; ${CONNECT}; ${FRAME}; ${FANC}; ${FACT}" always;

        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection 1;
        add_header Expect-CT 'enforce; max-age=7776000';
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()";
        add_header Referrer-Policy 'strict-origin';
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        client_max_body_size 64M;

        server_tokens off;

        location ~* \.map$ {
            deny all;
        }

        location ~* /\.hg|\/._darcs|\/\.bzr|\/BitKeeper {
            deny all;
            return 403;
        }

        location / {
            #add_header Server "";
            #more_clear_headers 'Server';
            root   /usr/local/openresty/nginx/html;
            index  index.html index.htm;
            try_files $uri /index.html;
        }

        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public";
        }

        location ~ ^/api/(.*)$ {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-NginX-Proxy true;    

            proxy_pass http://backendapi.backendapi.svc.cluster.local:80/api/$1$is_args$args;

            proxy_redirect off;
            proxy_hide_header X-Powered-By;
            proxy_hide_header Authorization;
            proxy_hide_header Server;
            proxy_hide_header X-Runtime;
            proxy_hide_header X-Auth-Token;
            proxy_hide_header X-Debug-Info;        
        }
    }
}