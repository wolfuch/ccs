server {
    listen       80;
    listen  [::]:80;

    resolver kube-dns.kube-system.svc.cluster.local valid=5s;

    server_name  localhost;

    #add_header Content-Security-Policy "default-src 'self' https://google.com https://youtube.com https://facebook.com https://fonts.google.com https://fonts.googleapis.com https://ajax.googleapis.com https://www.google-analytics.com https://cdnjs.cloudflare.com https://code.jquery.com https://connect.facebook.net https://s.imgur.com https://imgur.com https://i.imgur.com https://500px.com https://drscdn.500px.org https://www.reddit.com https://www.flickr.com https://c1.staticflickr.com https://maxcdn.bootstrapcdn.com http://code.ionicframework.com https://cdn.fontawesome.com/ https://kit.fontawesome.com/ https://cdn.jsdelivr.net/ https://code.jquery.com/ https://cdnjs.cloudflare.com/ https://stackpath.bootstrapcdn.com/; script-src 'self' https://kit.fontawesome.com/ https://cdn.jsdelivr.net/ https://code.jquery.com/ https://cdnjs.cloudflare.com/ https://stackpath.bootstrapcdn.com/ 'sha256-eCe5bOhGcDBv5wyLe4wm2b4Os0dCBLizH7q2u2lhN4U='; style-src 'self' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=' 'sha256-tc8Mz2OIxo69s0W5jsNX846P0aDkc2jAr12Cp33z2cc='; img-src 'self' data:; connect-src 'self' https://ka-f.fontawesome.com/; font-src 'self' https://ka-f.fontawesome.com/; object-src 'none'; media-src 'self'; form-action 'self'; frame-ancestors 'self';" always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection 1;
    add_header Strict-Transport-Security: max-age=31536000;
    add_header X-Content-Type-Options "nosniff";
    add_header Expect-CT 'enforce; max-age=7776000';
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }

    location ~ ^/api/(.*)$ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;    

        proxy_pass http://backendapi.backendapi.svc.cluster.local:80/api/$1$is_args$args;
        proxy_redirect off;
    }
}