worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    server_tokens off;
    more_clear_headers 'Server';

    add_header Server "" always;

    server {
        listen       80;
        listen  [::]:80;
    
        resolver kube-dns.kube-system.svc.cluster.local valid=5s;
    
        server_name  localhost;

        #setear variables CT
        set $SCRIPT "script-src 'self'";
        set $SCRIPT "${SCRIPT} https://*.rednegocios.cl";
        set $SCRIPT "${SCRIPT} https://www.google.com/recaptcha/";
        set $SCRIPT "${SCRIPT} https://www.gstatic.com/recaptcha/";
        #set $SCRIPT "${SCRIPT} 'sha256-r0hOKsWZbvFRgFfpw0AbE0vAAmn6sux/JwWvtmoJmmM='";
        #set $SCRIPT "${SCRIPT} 'sha256-6oo6lkjAy1qN5/li8eQE1xycGUCovDAXdnDNxmqNimM='";
        #set $SCRIPT "${SCRIPT} 'sha256-S1ajYLcio0QcdUNW0uR42TLMg6JoxRkFqAt5+9i+0Hw=' ";
        #set $SCRIPT "${SCRIPT} 'sha256-PzVFAPoirBTunDFPQP7meK1m1W6UugVpW0PjDlMA4ss='";
        #set $SCRIPT "${SCRIPT} 'sha256-Ud2ZjuQEyFvSwUL5QTZAm9gQt8TlhnI+7RUr1/X2GQk='";
        #set $SCRIPT "${SCRIPT} 'sha256-qVvhPOYY8z46X5BXUy3AyVFrFbn6eLdc1mNGj44OL+A='";

        set $STYLE "style-src 'self' 'nonce-$csp_nonce'";
        set $STYLE "${STYLE} https://*.rednegocios.cl/*";
        set $STYLE "${STYLE} 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU='";
        set $STYLE "${STYLE} 'sha256-QI1Xpve7fgIAL6rzPMQrp+SdOCFj5BsqtBwdf/fbegE='";
        set $STYLE "${STYLE} 'sha256-1fFFcb4ZF24nQzkqQbsVdu2s4Wnl//C7TpkEI8SRH5k='";
        set $STYLE "${STYLE} 'sha256-jkabFron4oVecrtDS5e5cZ9405xw/iVlRST4uw3vQc4='";
        set $STYLE "${STYLE} 'sha256-p2/Gksh+5ImPxjQMMeXjNWhotKcA92XrUi8eadlIpRk='";
        set $STYLE "${STYLE} 'sha256-alQ9q8x9z8YIzeU2xptI3CIh6yHwhdos49Hwj379s1A='";
        set $STYLE "${STYLE} 'sha256-xsqfd5NhyE2mAMXktv0dbbJ/Dtf/GVDn5IgfeiFcJ64='";

        set $STYLE "${STYLE} https://registry.npmjs.org/* 'sha256-fxT2vEPirY2ASBNBFCBWwEsLxCZJd3gjen03Q2lKeKE='";
        set $STYLE "${STYLE} https://fonts.googleapis.com";
        set $STYLE "${STYLE} 'sha256-JE1tcvlXH6qavyMOZvuChCPlHOJ0eVdh7xKpJhkbzww='";
        set $STYLE "${STYLE} 'sha256-i7g7xT1xYJH7BVeOK31MUZLF8+VyenKWd0BiiRZvEgQ='";
        set $STYLE "${STYLE} 'sha256-16DZS88s5QxKVJxU8ZFzvNl1dM5h4G4XPb9/V3LFI2s='";
        set $STYLE "${STYLE} 'sha256-vpvnoiobgjeVhQtIEE3KxCRYhmweVMwMkZXzpp4UAjY='";

        set $IMG "img-src 'self' data:";
        set $IMG "${IMG} https://*.rednegocios.cl/img/*";
        set $IMG "${IMG} https://*.rednegocios.cl/favicon/*";
        set $IMG "${IMG} https://www.gstatic.com/recaptcha/";
        set $FONT "font-src 'self' data:";
        set $FONT "${FONT} https://*.rednegocios.cl/dist/fon/*";
        set $FONT "${FONT} https://fonts.gstatic.com";
        set $DEFAULT "default-src 'self'";
        set $CONNECT "connect-src 'self'";
        set $CONNECT "${CONNECT} https://*.rednegocios.cl";
        set $CONNECT "${CONNECT} https://www.google.com/recaptcha/";
        set $FRAME "frame-src 'self'";
        set $FRAME "${FRAME} https://*.rednegocios.cl";
        set $FRAME "${FRAME} https://www.google.com/recaptcha/";
        set $FANC  "frame-ancestors 'self' https://*.rednegocios.cl";
        set $FACT  "form-action 'self'";
    
    
        add_header Content-Security-Policy "${SCRIPT}; ${STYLE}; ${IMG}; ${FONT}; ${DEFAULT}; ${CONNECT}; ${FRAME}; ${FANC}; ${FACT}" always;
    
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range' always;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection 1;
        add_header Expect-CT 'enforce; max-age=7776000';
        add_header X-Frame-Options SAMEORIGIN always;
        # add_header X-Frame-Options ALLOW-FROM *.rednegocios.cl;
        add_header Permissions-Policy "geolocation=(),midi=(),sync-xhr=(),microphone=(),camera=(),magnetometer=(),gyroscope=(),fullscreen=(self),payment=()";
        add_header Referrer-Policy 'strict-origin';
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        client_max_body_size 64M;
        server_tokens off;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Authorization;
        proxy_hide_header Server;
        proxy_hide_header X-Runtime;
        proxy_hide_header X-Auth-Token;
        proxy_hide_header X-Debug-Info;    
    
        location ~* \.map$ {
            deny all;
        }

        location ~* /\.hg|\/._darcs|\/\.bzr|\/BitKeeper {
            deny all;
            return 403;
        }

        location / {
            #add_header Server "";
            #more_clear_headers 'Server';
            root   /usr/local/openresty/nginx/html;
            index  index.html index.htm;
            try_files $uri /index.html;

            set $csp_nonce $request_id;

            sub_filter 'REPLACE_WITH_NONCE' '$csp_nonce';
            sub_filter_once on;
        }

        location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public";

            # 🔐 Security headers for static files
            add_header Content-Security-Policy "default-src 'self';" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }
    
        location ~ ^/api/(.*)$ {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_set_header X-NginX-Proxy true;    
    
            proxy_pass http://backendapi.backendapi.svc.cluster.local:80/api/$1$is_args$args;
            proxy_redirect off;
        }
    }
}